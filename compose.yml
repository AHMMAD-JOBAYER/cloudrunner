services:
  backend:
    image: cloud-backend
    container_name: cloud-backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:supersecretpassword@db:5432/university_nixos
    networks:
      - app-network

  frontend:
    image: cloud-frontend
    container_name: cloud-frontend
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: university_nixos
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

  caddy:
    image: caddy:alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  pg_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
